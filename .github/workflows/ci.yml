name: quality-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - name: Exigir Issue vinculada na PR
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -Eiq '(closes|fixes|resolves)[[:space:]]+#[0-9]+'; then
            echo 'A PR deve conter Closes #N, Fixes #N ou Resolves #N.'
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Biome
        run: yarn biome check src
      - name: Knip
        run: yarn knip
      - name: Unitários e cobertura
        run: yarn vitest run --coverage
      - name: Build
        run: yarn build
        env:
          REACT_APP_BACKEND_URL: https://example.invalid
          REACT_APP_SENTRY_DSN: ""
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Compilação Python
        run: python -m compileall -q backend api
      - name: Integração e cobertura
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: luxsex_ci
          CORS_ORIGINS: http://127.0.0.1:3000
          SENTRY_DSN: ""
        run: >-
          pytest -q
          backend/tests/test_vercel_horoscope.py
          backend/tests/test_observability.py
          --cov=backend
          --cov-report=xml:coverage.xml
          --cov-fail-under=50
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          fail_ci_if_error: true

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn playwright test

  sentry-release:
    name: sentry-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-quality, backend-quality, e2e, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar configuração Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo 'Secrets de release Sentry ainda não configurados; SDK/APM continua ativo sem upload de source maps.'
          else
            echo 'SENTRY_RELEASE_READY=true' >> "$GITHUB_ENV"
          fi
      - uses: getsentry/action-release@v3
        if: env.SENTRY_RELEASE_READY == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          release: luxsex@${{ github.sha }}