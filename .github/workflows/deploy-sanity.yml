name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'sanity-schemas/**'
      - 'sanity.config.js'
      - 'sanity.cli.js'
      - 'package.json'
      - '.github/workflows/deploy-sanity.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx sanity deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
