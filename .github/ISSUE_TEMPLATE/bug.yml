name: Correção
description: Reportar um defeito reproduzível
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Descreva comportamento atual, impacto e contexto.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução
      description: Liste passos, rota, ambiente e resultado observado.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Use itens objetivos e verificáveis.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Testes e observabilidade
      description: Indique testes, logs, traces e alertas necessários.
    validations:
      required: true