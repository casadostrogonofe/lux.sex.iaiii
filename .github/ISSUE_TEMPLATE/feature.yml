name: Nova função
description: Propor uma capacidade nova
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Resultado esperado
      description: Explique o valor para a pessoa usuária.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo e fora de escopo
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: states
    attributes:
      label: Estados, motion e acessibilidade
      description: Detalhe loading, erro, vazio, sucesso e reduced motion.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Testes e observabilidade
    validations:
      required: true